apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Patch the Helm-rendered Deployment to scale it
patches:
  - path: replica-patch.yaml
    target:
      kind: Deployment
      name: demo-hello-open5gs

# Add a label to everything to show this overlay was applied
commonLabels:
  demo.gitops/managed-by: kustomize-overlay
